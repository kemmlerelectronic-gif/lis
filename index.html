<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEMMSOFT STOCK 8V - Voice Controlled</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #00d4ff;
            --danger: #ff4d4d;
            --warning: #ffcc00;
            --bg-dark: rgba(0, 0, 0, 0.95);
            --card-bg: rgba(20, 20, 20, 0.9);
        }

        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; height: 100vh; background: #000; }
        #video-bg { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; filter: brightness(15%); }

        .header-ui { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px; z-index: 1000; }
        .brand { font-size: 1.8rem; font-weight: 900; color: var(--primary); letter-spacing: 3px; }
        
        /* Indikátor mikrofonu */
        .voice-status { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.1rem; }
        .pulse-mic { width: 12px; height: 12px; background: #2ecc71; border-radius: 50%; }
        .pulse-mic.listening { animation: mic-glow 1s infinite; background: var(--danger); }
        @keyframes mic-glow { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,77,77,0.7); } 70% { transform: scale(1.2); box-shadow: 0 0 0 10px rgba(255,77,77,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,77,77,0); } }

        nav { display: flex; gap: 10px; margin-right: 40px; }
        button { background: rgba(0,0,0,0.7); border: 1px solid var(--primary); color: white; padding: 10px 20px; cursor: pointer; font-weight: bold; }

        .section { display: none; height: 100vh; width: 100%; justify-content: center; align-items: center; flex-direction: column; }
        .active { display: flex; }

        /* --- HLASOVÝ VIZUÁL --- */
        #voice-overlay { display: none; background: rgba(0,0,0,0.85); border: 3px dashed var(--primary); padding: 40px; border-radius: 20px; text-align: center; max-width: 600px; box-shadow: 0 0 50px rgba(0,212,255,0.3); z-index: 2000; }
        .speech-preview { font-style: italic; color: #aaa; margin-top: 20px; min-height: 24px; }

        /* --- CAROUSEL "LINKA" --- */
        #carousel-viewport { width: 100%; overflow: hidden; position: relative; height: 500px; }
        #carousel-track { display: flex; gap: 60px; position: absolute; left: 0; will-change: transform; align-items: center; }
        
        .card { min-width: 500px; background: var(--card-bg); padding: 40px; border-radius: 20px; border: 2px solid var(--primary); box-shadow: 0 20px 40px rgba(0,0,0,0.8); flex-shrink: 0; position: relative; }
        .card.is-key { border-color: var(--warning); }
        .card.is-key::before { content: "⭐ KLÍČOVÝ DÍL"; position: absolute; top: -15px; left: 20px; background: var(--warning); color: black; padding: 2px 15px; border-radius: 10px; font-weight: bold; font-size: 0.8rem; }
        .card.is-critical { border-color: var(--danger); background: rgba(60, 0, 0, 0.9); box-shadow: 0 0 50px rgba(255, 77, 77, 0.4); }
        
        .card.is-key.is-critical { animation: alert-pulse 1.5s infinite; }
        @keyframes alert-pulse {
            0% { border-color: var(--warning); }
            50% { border-color: var(--danger); box-shadow: 0 0 60px var(--danger); }
            100% { border-color: var(--warning); }
        }

        .stock-val { font-size: 5rem; font-weight: 900; }
        .delta-val { font-size: 1.5rem; margin-top: 10px; }

        /* --- TABULKA & TICKER --- */
        .inventory-container { width: 85%; max-height: 70vh; overflow-y: auto; background: var(--card-bg); padding: 30px; border-radius: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--primary); padding: 15px; border-bottom: 2px solid var(--primary); }
        td { padding: 15px; border-bottom: 1px solid #222; }
        .row-key { color: var(--warning) !important; font-weight: bold; }
        
        .critical-bar { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--danger); color: white; padding: 12px 0; font-weight: bold; overflow: hidden; z-index: 10; }
        .ticker-wrap { display: inline-block; animation: ticker-move 30s linear infinite; white-space: nowrap; }
        @keyframes ticker-move { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        .admin-form { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--primary); width: 420px; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid #444; color: white; box-sizing: border-box; }
        .checkbox-group { margin: 15px 0; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <video autoplay muted loop id="video-bg">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-server-room-background-31714-large.mp4" type="video/mp4">
    </video>

    <div class="header-ui">
        <div class="brand">KEMMSOFT STOCK 8V</div>
        <div class="voice-status">
            <div class="pulse-mic" id="mic-indicator"></div>
            <span id="status-text">Klikněte kamkoli pro aktivaci mikrofonu</span>
        </div>
        <nav>
            <button onclick="showSection('overview')">Přehled (TV)</button>
            <button onclick="showSection('inventory')">Obsah skladu</button>
            <button onclick="showSection('admin')">Admin</button>
        </nav>
    </div>

    <!-- SEKCE: HLASOVÝ DIALOG -->
    <div id="voice-dialog" class="section">
        <div id="voice-overlay">
            <h1 id="voice-prompt" style="color: var(--primary); font-size: 2.5rem;">Naslouchám...</h1>
            <div id="voice-card-showcase"></div>
            <div class="speech-preview" id="speech-preview">Čekám na aktivační příkaz...</div>
        </div>
    </div>

    <div id="overview" class="section active">
        <div id="carousel-viewport"><div id="carousel-track"></div></div>
        <div class="critical-bar"><div class="ticker-wrap" id="ticker-content"></div></div>
    </div>

    <div id="inventory" class="section">
        <div class="inventory-container">
            <h1>Skladová evidence</h1>
            <table>
                <thead><tr><th>ID</th><th>Název</th><th>Skladem</th><th>Minimum</th><th>Priorita</th><th>Status</th></tr></thead>
                <tbody id="inventory-list"></tbody>
            </table>
        </div>
    </div>

    <div id="admin" class="section">
        <div class="admin-form">
            <h2>Aktualizace dat</h2>
            <input type="text" id="itemNum" placeholder="ID (Katalogové číslo)">
            <input type="text" id="itemName" placeholder="Název náhradního dílu">
            <input type="number" id="itemCount" placeholder="Aktuální stav (ks)">
            <input type="number" id="itemMin" placeholder="Minimální limit (ks)">
            <label class="checkbox-group">
                <input type="checkbox" id="itemKey" style="width: auto;"> Klíčový náhradní díl (PRIORITA)
            </label>
            <button onclick="addItem()" style="width: 100%; margin-top: 10px; background: var(--primary); color: black;">ULOŽIT ZMĚNY</button>
            <button onclick="clearAll()" style="width: 100%; margin-top: 20px; opacity: 0.3; font-size: 0.7rem;">Resetovat celý systém</button>
        </div>
    </div>

    <script>
        let stock = JSON.parse(localStorage.getItem('k_stock_v8_priorities')) || [
            { id: "101", name: "Senzor tlaku", count: 12, min: 5, isKey: false },
            { id: "102", name: "Servomotor 8V", count: 2, min: 3, isKey: true }
        ];
        let pos = 0;
        let animationFrame;
        
        let voiceState = "IDLE"; 
        let currentAction = null; 
        let targetItem = null;
        let targetQty = 0;
        let isRecognitionRunning = false;
        let systemInitialized = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Tento prohlížeč nepodporuje rozpoznávání hlasu. Použijte Google Chrome.");
        }
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'cs-CZ';
        recognition.continuous = false; 
        recognition.interimResults = false;

        function speak(text, callback) {
            try { recognition.stop(); } catch(e) {}
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'cs-CZ';
            utterance.onend = () => { 
                if (callback) callback();
                startSpeechRecognition(); 
            };
            window.speechSynthesis.speak(utterance);
        }

        function startSpeechRecognition() {
            if (!systemInitialized) return;
            if (!isRecognitionRunning) {
                try {
                    recognition.start();
                } catch(e) {}
            }
        }

        recognition.onstart = function() {
            isRecognitionRunning = true;
            if(voiceState === "IDLE") {
                document.getElementById('status-text').innerText = 'Hlasový asistent aktivní (Řekněte "KEMSOFT")';
                document.getElementById('mic-indicator').className = "pulse-mic";
            }
        };

        recognition.onend = function() {
            isRecognitionRunning = false;
            setTimeout(startSpeechRecognition, 400);
        };

        recognition.onerror = function(event) {
            console.log("Hlasová chyba: ", event.error);
            if (event.error === 'not-allowed') {
                document.getElementById('status-text').innerText = "Chyba: Povolte mikrofon v adresním řádku!";
                document.getElementById('status-text').style.color = "var(--danger)";
            }
        };

        recognition.onresult = function(event) {
            const result = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
            document.getElementById('speech-preview').innerText = `Slyšel jsem: "${result}"`;
            
            if (result.includes("konec")) {
                speak("Ukončuji operaci.", () => { resetVoiceSystem(); });
                return;
            }

            switch(voiceState) {
                case "IDLE":
                    if (result.includes("kemsoft") || result.includes("kemmsoft")) {
                        voiceState = "ACTION_CHOOSE";
                        document.getElementById('mic-indicator').classList.add('listening');
                        document.getElementById('status-text').innerText = "Systém KEMSOFT naslouchá požadavku";
                        showSection('voice-dialog');
                        document.getElementById('voice-overlay').style.display = 'block';
                        document.getElementById('voice-prompt').innerText = "Chcete naskladnit nebo vyskladnit?";
                        speak("Chcete naskladnit nebo vyskladnit?");
                    }
                    break;

                case "ACTION_CHOOSE":
                    if (result.includes("naskladnit")) {
                        currentAction = "IN";
                        goToGetItem();
                    } else if (result.includes("vyskladnit")) {
                        currentAction = "OUT";
                        goToGetItem();
                    } else {
                        speak("Řekněte naskladnit nebo vyskladnit.");
                    }
                    break;

                case "ITEM_CHOOSE":
                    let found = stock.find(item => result.includes(item.name.toLowerCase()) || result.includes(item.id));
                    if (found) {
                        targetItem = found;
                        voiceState = "QTY_CHOOSE";
                        let promptText = currentAction === "IN" ? "Jaké množství přidáte?" : "Jaké množství odeberete?";
                        document.getElementById('voice-prompt').innerText = promptText;
                        speak(promptText);
                    } else {
                        speak("Tuto položku nemám v evidenci. Zkuste to znovu.");
                    }
                    break;

                case "QTY_CHOOSE":
                    let match = result.match(/\d+/);
                    if (match) {
                        targetQty = parseInt(match[0]);
                        executeVoiceTransaction();
                    } else {
                        speak("Zadejte množství čísly.");
                    }
                    break;
            }
        };

        function goToGetItem() {
            voiceState = "ITEM_CHOOSE";
            document.getElementById('voice-prompt').innerText = "Jakou položku?";
            speak("Jakou položku?");
        }

        function executeVoiceTransaction() {
            let oldQty = targetItem.count;
            if (currentAction === "IN") {
                targetItem.count += targetQty;
            } else {
                if(targetQty > targetItem.count) {
                    speak("Chyba. Na skladě není dostatek kusů.");
                    resetVoiceSystem();
                    return;
                }
                targetItem.count -= targetQty;
            }

            localStorage.setItem('k_stock_v8_priorities', JSON.stringify(stock));

            const critical = targetItem.count <= targetItem.min;
            document.getElementById('voice-prompt').innerText = "Transakce dokončena";
            document.getElementById('voice-card-showcase').innerHTML = `
                <div class="card ${targetItem.isKey ? 'is-key' : ''} ${critical ? 'is-critical' : ''}" style="margin: 30px auto; float:none;">
                    <div style="display:flex; justify-content:space-between; color: ${targetItem.isKey ? 'var(--warning)' : 'var(--primary)'}">
                        <span>ID: ${targetItem.id}</span>
                        <span>${critical ? 'STAV: KRITICKÝ' : 'STAV: OK'}</span>
                    </div>
                    <h1 style="margin: 20px 0;">${targetItem.name}</h1>
                    <div class="stock-val">${targetItem.count} <small style="font-size:1.5rem">ks</small></div>
                    <div class="delta-val" style="color: ${currentAction === 'IN' ? '#2ecc71' : 'var(--danger)'}">
                        ${currentAction === 'IN' ? '▲ Přidáno' : '▼ Odebráno'}: ${targetQty} ks (Původně: ${oldQty} ks)
                    </div>
                </div>
            `;

            speak(`Položka ${targetItem.name} aktualizována na ${targetItem.count} kusů. Pro restart nebo návrat na přehled řekněte konec.`);
        }

        function resetVoiceSystem() {
            voiceState = "IDLE";
            currentAction = null;
            targetItem = null;
            targetQty = 0;
            document.getElementById('mic-indicator').classList.remove('listening');
            document.getElementById('status-text').innerText = 'Hlasový asistent připraven (Řekněte "KEMSOFT")';
            document.getElementById('voice-card-showcase').innerHTML = '';
            document.getElementById('speech-preview').innerText = 'Čekám na aktivační příkaz...';
            showSection('overview');
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            cancelAnimationFrame(animationFrame);
            if (id === 'overview') initCarousel();
            else if (id === 'inventory') renderTable();
            updateTicker();
        }

        function addItem() {
            const id = document.getElementById('itemNum').value.trim();
            const name = document.getElementById('itemName').value.trim();
            const count = parseInt(document.getElementById('itemCount').value);
            const min = parseInt(document.getElementById('itemMin').value);
            const isKey = document.getElementById('itemKey').checked;

            if (!id || isNaN(count)) return alert('Zadejte data!');
            
            const existingIndex = stock.findIndex(item => item.id === id);
            if (existingIndex !== -1) {
                stock[existingIndex].count = count;
                if(name) stock[existingIndex].name = name;
                if(!isNaN(min)) stock[existingIndex].min = min;
                stock[existingIndex].isKey = isKey;
            } else {
                stock.push({ id, name: name || "Díl X", count, min: min || 0, isKey });
            }
            localStorage.setItem('k_stock_v8_priorities', JSON.stringify(stock));
            alert('Uloženo!');
            document.querySelectorAll('input:not([type="checkbox"])').forEach(i => i.value = '');
            document.getElementById('itemKey').checked = false;
        }

        function renderTable() {
            document.getElementById('inventory-list').innerHTML = stock.map(item => `
                <tr style="color: ${item.count <= item.min ? 'var(--danger)' : 'white'}" class="${item.isKey ? 'row-key' : ''}">
                    <td>${item.id}</td><td>${item.isKey ? '⭐ ' : ''}${item.name}</td><td><strong>${item.count} ks</strong></td><td>${item.min} ks</td><td>${item.isKey ? 'KLÍČOVÝ' : 'Běžný'}</td><td>${item.count <= item.min ? '⚠️ DOPLNIT' : '✅ OK'}</td>
                </tr>
            `).join('');
        }

        function initCarousel() {
            const track = document.getElementById('carousel-track');
            if (stock.length === 0) return;
            const fullList = [...stock, ...stock, ...stock];
            track.innerHTML = fullList.map(item => {
                const critical = item.count <= item.min;
                return `
                    <div class="card ${item.isKey ? 'is-key' : ''} ${critical ? 'is-critical' : ''}">
                        <div style="display:flex; justify-content:space-between; color: ${item.isKey ? 'var(--warning)' : 'var(--primary)'}"><span>ID: ${item.id}</span></div>
                        <h1 style="margin: 20px 0;">${item.name}</h1>
                        <div class="stock-val">${item.count} <small style="font-size: 1.5rem">ks</small></div>
                        <p>Minimum: ${item.min} ks</p>
                    </div>
                `;
            }).join('');
            pos = 0;
            animate();
        }

        function animate() {
            const track = document.getElementById('carousel-track');
            const cardWidth = 500 + 60; 
            const resetPoint = cardWidth * stock.length;
            pos -= 1.2; 
            if (Math.abs(pos) >= resetPoint) pos = 0;
            if(track) track.style.transform = `translateX(${pos}px)`;
            animationFrame = requestAnimationFrame(animate);
        }

        function updateTicker() {
            const criticals = stock.filter(i => i.count <= i.min);
            document.getElementById('ticker-content').innerHTML = criticals.length > 0 ? 
                "⚠️ NEDOSTATEK ZÁSOB: " + criticals.map(i => `${i.isKey ? '⭐PRIORITA! ' : ''}${i.name} (${i.count}ks)`).join(" +++ ") : "VŠECHNY POLOŽKY V NORMĚ • KEMMSOFT 8V";
        }

        function clearAll() { if(confirm('Smazat vše?')) { localStorage.clear(); stock = []; location.reload(); } }

        // První interakce uživatele pro odblokování audio kontextu prohlížeče
        window.onload = () => {
            initCarousel();
            document.body.addEventListener('click', () => {
                if(!systemInitialized) {
                    systemInitialized = true;
                    isRecognitionRunning = false;
                    startSpeechRecognition();
                }
            }, { once: true });
        };
    </script>
</body>
</html>
